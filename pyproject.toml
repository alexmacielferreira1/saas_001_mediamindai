[project]
name = "hub-mediamind"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<2.1", "pydantic-settings>=2.5,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.13,<2", "python-multipart>=0.0.20,<1", "rembg[cpu]>=2.0.69,<3", "cryptography>=46,<51", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "tests"]
pythonpath = ["backend"]
markers = ["integration: requires local PostgreSQL"]

[tool.coverage.run]
branch = true
source = ["backend/app"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
